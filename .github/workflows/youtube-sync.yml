name: Sync YouTube uploads

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/youtube-sync.mjs"
      - ".github/workflows/youtube-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest public YouTube uploads
        run: node scripts/youtube-sync.mjs

      - name: Commit updated video list
        run: |
          if git diff --quiet -- videos.json; then
            echo "No new uploads."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git commit -m "chore: sync latest YouTube uploads"
          git push
