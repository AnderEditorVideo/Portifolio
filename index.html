<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anderson Ferreira | Video Editor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0a0f0d;
            color: #e6e8ec;
            font-family: Arial, sans-serif;
        }

        /* Secção Principal (Hero) */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            /* Substitui 'sua-foto.jpg' pelo nome ou link da tua foto */
            background: linear-gradient(180deg, rgba(12, 35, 18, 0.6) 0%, rgba(8, 20, 12, 0.9) 100%), 
                        url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=1000') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 50px;
            text-align: center;
        }

        .hero-title {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: 3px;
            color: #ffffff;
            margin-bottom: 5px;
        }

        .hero-subtitle {
            font-size: 0.75rem;
            letter-spacing: 4px;
            color: #a0c4ab;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .hero-btn {
            display: inline-block;
            background-color: #00c853;
            color: #ffffff;
            padding: 10px 22px;
            font-size: 0.85rem;
            text-decoration: none;
            border-radius: 3px;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .hero-btn:hover {
            background-color: #00a843;
        }

        /* Conteúdo restante do site */
        .content {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .section-title {
            font-size: 1.6rem;
            color: #00c853;
            margin-bottom: 20px;
            border-left: 3px solid #00c853;
            padding-left: 10px;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #141a16;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 40px;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <!-- Cabeçalho / Hero Section -->
    <section class="hero">
        <h1 class="hero-title">Anderson Ferreira</h1>
        <p class="hero-subtitle">Video Editor</p>
        <a href="#work" class="hero-btn">Learn More ↗</a>
    </section>

    <!-- Conteúdo do Portfólio -->
    <div class="content" id="work">
        <h2 class="section-title">Selected Work</h2>
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/SEU_ID_AQUI" allowfullscreen></iframe>
        </div>
    </div>

</body>
</html>
